<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">NOD — Link Studio</title>
<desc id="d">Editorial hero in NOD's own visual language: warm paper, ink type, vermilion accents, and the orbit motif from the product.</desc>
<defs>
<filter id="card" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#2d271e" flood-opacity="0.10"/>
</filter>
</defs>
<rect width="1200" height="630" fill="#f2efe7"/>
<!-- hairline frame -->
<rect x="24" y="24" width="1152" height="582" fill="none" stroke="#121310" stroke-opacity="0.14" stroke-width="1"/>
<!-- top bar -->
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif">
<text x="56" y="78" font-size="22" font-weight="800" letter-spacing="2" fill="#121310">●●● NOD</text>
<text x="200" y="78" font-size="13" letter-spacing="4" fill="#69685f">LINK STUDIO</text>
<text x="1144" y="78" font-size="13" letter-spacing="2" fill="#69685f" text-anchor="end">n0d.netlify.app</text>
</g>
<line x1="56" y1="102" x2="1144" y2="102" stroke="#121310" stroke-opacity="0.14"/>
<!-- eyebrow -->
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif">
<circle cx="62" cy="152" r="4" fill="#ff5b3a"/>
<text x="76" y="158" font-size="14" letter-spacing="3.5" fill="#69685f">A QUIET TOOL FOR NOISY URLS</text>
</g>
<!-- headline -->
<text x="56" y="262" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="900" letter-spacing="-3" fill="#121310">Short links.</text>
<text x="56" y="372" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="104" fill="#121310">Long memory.</text>
<!-- shortening card -->
<g filter="url(#card)">
<rect x="56" y="412" width="560" height="118" rx="22" fill="#f7f4ec" stroke="#121310" stroke-opacity="0.12"/>
</g>
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif">
<text x="88" y="448" font-size="12" letter-spacing="3" fill="#69685f">DESTINATION URL</text>
<text x="88" y="480" font-size="19" fill="#69685f">https://your-very-long-link.com/launch?campaign=summer&amp;utm…</text>
<line x1="88" y1="472" x2="560" y2="472" stroke="#69685f" stroke-width="1.5" opacity="0.7"/>
<text x="88" y="514" font-size="21" font-weight="700" fill="#121310">n0d.netlify.app/<tspan fill="#ff5b3a">Ab3xQ7</tspan></text>
</g>
<!-- orbit motif, echoing the product -->
<g fill="none" stroke="#121310">
<circle cx="906" cy="330" r="196" stroke-opacity="0.10"/>
<circle cx="906" cy="330" r="132" stroke-opacity="0.14"/>
<circle cx="906" cy="330" r="68" stroke-opacity="0.18"/>
</g>
<g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#69685f">
<circle cx="762" cy="212" r="7" fill="#ff5b3a" stroke="none"/>
<text x="742" y="190">create</text>
<circle cx="1090" cy="330" r="7" fill="#121310" stroke="none"/>
<text x="1104" y="336">learn</text>
<circle cx="906" cy="512" r="7" fill="#69685f" stroke="none"/>
<text x="892" y="548">route</text>
</g>
<!-- footer -->
<line x1="56" y1="566" x2="1144" y2="566" stroke="#121310" stroke-opacity="0.14"/>
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="2.5" fill="#69685f">
<text x="56" y="592">○ BUILT FOR CLARITY</text>
<text x="300" y="592">○ PRIVACY-AWARE ANALYTICS</text>
<text x="600" y="592">○ SAME-HOST REDIRECTS</text>
</g>
</svg>
